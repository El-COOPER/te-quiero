<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <radialGradient id="blue-cloud">
      <stop stop-color="#79C8FF" stop-opacity=".72"/>
      <stop offset=".38" stop-color="#397DDC" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2852C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-cloud">
      <stop stop-color="#A3A7FF" stop-opacity=".58"/>
      <stop offset=".45" stop-color="#6864D9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6864D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-cloud">
      <stop stop-color="#8AF0FF" stop-opacity=".54"/>
      <stop offset=".4" stop-color="#56B8ED" stop-opacity=".24"/>
      <stop offset="1" stop-color="#56B8ED" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-60%" width="200%" height="220%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>
    <filter id="soft-small" x="-40%" y="-50%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <ellipse cx="430" cy="470" fill="url(#blue-cloud)" rx="360" ry="230" transform="rotate(-24 430 470)"/>
    <ellipse cx="1100" cy="480" fill="url(#violet-cloud)" rx="400" ry="250" transform="rotate(22 1100 480)"/>
    <ellipse cx="790" cy="300" fill="url(#cyan-cloud)" rx="280" ry="180" transform="rotate(-8 790 300)"/>
    <ellipse cx="780" cy="720" fill="url(#blue-cloud)" rx="390" ry="210" transform="rotate(13 780 720)"/>
  </g>
  <g filter="url(#soft-small)" opacity=".74">
    <path d="M190 500c150-210 310-250 450-115 120 115 246 145 400 35 135-96 266-89 374 24-105 167-255 238-426 196-192-48-285-26-439 79-129 88-253 49-359-84Z" fill="url(#blue-cloud)"/>
    <path d="M298 651c137-139 255-157 363-55 115 109 215 112 340 9 125-103 226-91 307 34-105 122-231 172-379 117-132-48-238-19-352 68-112 85-207 36-279-88Z" fill="url(#violet-cloud)"/>
  </g>
  <g fill="#D8F0FF">
    <circle cx="316" cy="352" r="2" opacity=".55"/>
    <circle cx="522" cy="600" r="1.5" opacity=".45"/>
    <circle cx="720" cy="222" r="2" opacity=".65"/>
    <circle cx="928" cy="660" r="1.8" opacity=".52"/>
    <circle cx="1190" cy="345" r="2.2" opacity=".58"/>
    <circle cx="1350" cy="568" r="1.6" opacity=".5"/>
  </g>
</svg>
