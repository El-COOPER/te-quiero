<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090711">
    <meta name="description" content="Un universo azul para la niña de la sonrisa más linda.">
    <title>Un universo especial</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="universe" aria-label="Una galaxia especial">
      <canvas id="galaxy" aria-hidden="true"></canvas>
      <img class="nebula" src="img/nebula.svg" alt="" aria-hidden="true">
      <img class="distant-worlds" src="img/distant-worlds.svg" alt="" aria-hidden="true">
      <span class="shooting-star shooting-star-one" aria-hidden="true"></span>
      <span class="shooting-star shooting-star-two" aria-hidden="true"></span>
      <span class="shooting-star shooting-star-three" aria-hidden="true"></span>
      <span class="floating-moon" aria-hidden="true">☾</span>
      <span class="floating-heart" aria-hidden="true">♡</span>
      <div class="scene" id="scene">
        <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-two" aria-hidden="true">✧</span>
        <span class="sparkle sparkle-three" aria-hidden="true">✧</span>
        <span class="sparkle sparkle-four" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-five" aria-hidden="true">♡</span>
        <span class="sparkle sparkle-six" aria-hidden="true">✧</span>
        <section class="message">
          <figure class="planet">
            <img src="img/planet.svg" alt="Un planeta azul rodeado de anillos brillantes">
          </figure>
          <p class="eyebrow">Mi lugar favorito en el universo</p>
          <h1>Te quiero</h1>
          <figure class="constellation" aria-hidden="true">
            <img src="img/constellation.svg" alt="">
          </figure>
          <p class="dedication">para la niña de la sonrisa más linda</p>
          <p class="wish-tag"><span aria-hidden="true">✦</span> Eres mi estrella favorita <span aria-hidden="true">✦</span></p>
        </section>
        <figure class="flowers" aria-hidden="true">
          <img src="img/flowers.svg" alt="">
        </figure>
        <figure class="spider-sticker spider-one">
          <img src="img/1.png" alt="Spider-Man en pose de superhéroe">
        </figure>
        <figure class="spider-sticker spider-two">
          <img src="img/2.png" alt="Spider-Man comparte un momento tierno con Hello Kitty">
        </figure>
        <figure class="spider-sticker spider-three">
          <img src="img/4.png" alt="Spider-Man en pose de salto">
        </figure>
        <figure class="crest-sticker">
          <img src="img/5.png" alt="Escudo del Fútbol Club Barcelona">
        </figure>
      </div>
    </main>
  </body>
</html>
